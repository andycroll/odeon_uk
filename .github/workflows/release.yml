name: Release Gem

on:
  workflow_dispatch:

jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: x86_64-linux-gnu
          - runner: ubuntu-24.04-arm
            platform: aarch64-linux-gnu
          - runner: macos-15
            platform: arm64-darwin
          - runner: macos-15-intel
            platform: x86_64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake 'package:native[${{ matrix.platform }}]'
      - run: ODEON_PACKAGE="$(echo pkg/*.gem)" bundle exec ruby test/package_test.rb
      - uses: actions/upload-artifact@v4
        with:
          name: gem-${{ matrix.platform }}
          path: pkg/*.gem

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - run: bundle exec rake test
      - run: bundle exec rake build
      - uses: actions/download-artifact@v4
        with:
          path: pkg
          pattern: gem-*
          merge-multiple: true
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - name: Push the source and platform gems
        run: |
          for gem in pkg/*.gem; do
            if output=$(gem push "$gem" 2>&1); then
              echo "$output"
            elif echo "$output" | grep -q "Repushing of gem versions is not allowed"; then
              echo "Already published: $gem"
            else
              echo "$output"
              exit 1
            fi
          done
      - name: Tag the release
        run: |
          tag="v$(ruby -e 'print Gem::Specification.load(Dir["*.gemspec"].first).version')"
          if git ls-remote --exit-code --tags origin "$tag" >/dev/null; then
            echo "$tag already exists"
          else
            git tag "$tag"
            git push origin "$tag"
          fi
